name: HamApp Owner Installable Previews (Android APK + Windows EXE Setup)
on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/owner-installable-previews.yml'
      - 'scripts/build_ui_contract.py'
      - 'tests/test_build_ui_contract.py'
      - 'scripts/package_owner_preview.py'
      - 'scripts/HamApp-Verify-Preview.cmd'
      - 'tests/test_package_owner_preview.py'
      - 'android/**'
      - 'deployment/**'
      - 'scripts/hamapp_operator.py'
      - 'scripts/build_service_kit.py'
      - 'scripts/hamapp_service_windows_setup.py'
      - 'tests/test_hamapp_service_operator.py'
      - 'tests/test_winget_full_surface.py'
      - 'windows_client/**'
      - 'windows_installer/**'
      - 'run_windows_client.py'
      - 'catalog/**'
  push:
    branches: [main]
    paths:
      - '.github/workflows/owner-installable-previews.yml'
      - 'scripts/build_ui_contract.py'
      - 'tests/test_build_ui_contract.py'
      - 'scripts/package_owner_preview.py'
      - 'tests/test_package_owner_preview.py'
      - 'android/**'
      - 'deployment/**'
      - 'scripts/hamapp_operator.py'
      - 'scripts/build_service_kit.py'
      - 'scripts/hamapp_service_windows_setup.py'
      - 'tests/test_hamapp_service_operator.py'
      - 'tests/test_winget_full_surface.py'
      - 'windows_client/**'
      - 'windows_installer/**'
      - 'run_windows_client.py'
      - 'catalog/**'
permissions:
  contents: read
jobs:
  android:
    if: github.repository == 'rezamahrm100-ops/hamapp-store' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Compile Android native app and check signed debug APK
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tests -v
          python3 scripts/build_android_catalog.py
          test -s android/app/src/main/assets/store-capabilities.json
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install 'platforms;android-36' 'build-tools;35.0.0'
          gradle --no-daemon -p android :app:assembleDebug :app:lintDebug
          apk=android/app/build/outputs/apk/debug/app-debug.apk
          test -s "$apk"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify "$apk"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$apk" | grep -F "package: name='ir.hamapp.store'"
          mkdir -p dist/owner-preview/android
          cp "$apk" dist/owner-preview/android/HamApp-Android-Preview-debug.apk
          cp scripts/HamApp-Verify-Preview.cmd dist/owner-preview/android/
          python3 scripts/package_owner_preview.py --platform android --directory dist/owner-preview/android
      - name: Upload APK, SHA256 and Persian installation notes
        uses: actions/upload-artifact@v4
        with:
          name: HamApp-Android-Owner-Test-APK
          path: dist/owner-preview/android/
          retention-days: 7
          if-no-files-found: error
      - name: Report owner-only test scope
        if: success()
        shell: bash
        run: |
          echo "### HamApp Android native DEBUG APK (owner test)" >> "$GITHUB_STEP_SUMMARY"
          echo "Source SHA: $GITHUB_SHA. Build/signature checked, NOT production-signed, installed on owner phone, or approved for public release. Download Android Owner Test artifact." >> "$GITHUB_STEP_SUMMARY"

  service-kit:
    # Builds the backend from the same immutable checkout as both native
    # clients. PR builds use only hosted workers and disposable source.
    if: github.repository == 'rezamahrm100-ops/hamapp-store' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify actual POSIX private TLS backend, token lifecycle and one ZIP
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tests -p 'test_hamapp_service_operator.py' -v
          python3 -m unittest discover -s tests -p 'test_owner_publisher_real_tls.py' -v
          docker compose -f deployment/compose.yaml -p hamapp-private-ci config --quiet
          # Optional owner review cannot start in the default backend run.
          test "$(docker compose -f deployment/compose.yaml -p hamapp-private-ci config --services)" = "publisher-intake"
          mkdir -p "$RUNNER_TEMP/hamapp-owner-review-toolchain"
          chmod 0700 "$RUNNER_TEMP/hamapp-owner-review-toolchain"
          # Hosted runner only: mount owned by the image's exact unprivileged UID.
          sudo chown 10001:10001 "$RUNNER_TEMP/hamapp-owner-review-toolchain"
          HAMAPP_OWNER_REVIEW_DIR="$RUNNER_TEMP/hamapp-owner-review-toolchain" \
            docker compose -f deployment/compose.yaml -p hamapp-private-ci \
              --profile owner-review build owner-review
          HAMAPP_OWNER_REVIEW_DIR="$RUNNER_TEMP/hamapp-owner-review-toolchain" \
            docker compose -f deployment/compose.yaml -p hamapp-private-ci \
              --profile owner-review run --rm --no-deps --entrypoint sh owner-review \
              -ec 'command -v fdroid; command -v apksigner; command -v aapt; command -v clamscan; command -v gh; gh attestation verify --help >/dev/null; python3 -B -c "import sys;sys.path.insert(0,\"/opt/hamapp/scripts\");import owner_verified_release_pipeline"'
          echo "HOSTED_OPTIONAL_REVIEW_IMAGE_TOOLS_PASS; NO_PRIVATE_SIGNING_KEYS"
          docker compose -f deployment/compose.yaml -p hamapp-private-ci build publisher-intake
          # Real OCI-level integration, using disposable hosted-CI-only data.
          # No production accounts or private signing keys are used.
          trap 'docker compose -f deployment/compose.yaml -p hamapp-private-ci down --volumes --remove-orphans >/dev/null 2>&1 || true' EXIT
          # CI makes its own disposable credential in a mode-0600 runner file;
          # no token is ever emitted to stdout, Docker logs, or GitHub summaries.
          python3 - <<'PY'
          import os, pathlib, secrets
          target = pathlib.Path(os.environ["RUNNER_TEMP"]) / "hamapp-ci-private-first-token.txt"
          fd = os.open(target, os.O_CREAT | os.O_EXCL | os.O_WRONLY, 0o600)
          with os.fdopen(fd, "wb") as handle:
              handle.write(secrets.token_urlsafe(48).encode("ascii"))
          PY
          docker compose -f deployment/compose.yaml -p hamapp-private-ci run \
            --rm --no-deps -T publisher-intake init \
            --root /data/service --publisher ci-publisher --dev-local-cert \
            --token-stdin < "$RUNNER_TEMP/hamapp-ci-private-first-token.txt"
          docker compose -f deployment/compose.yaml -p hamapp-private-ci up \
            -d --no-build publisher-intake >/dev/null
          docker compose -f deployment/compose.yaml -p hamapp-private-ci run \
            --rm --no-deps -T publisher-intake export-ca \
            --root /data/service > "$RUNNER_TEMP/hamapp-ci-private-ca.pem"
          # Verified TLS, exact certificate pin, authenticated binary
          # quarantine and wrong-token rejection against the live container.
          python3 - <<'PY'
          import base64, hashlib, http.client, json, os, pathlib, ssl, time
          tmp = pathlib.Path(os.environ["RUNNER_TEMP"])
          secret = (tmp / "hamapp-ci-private-first-token.txt").read_text("ascii")
          assert len(secret) == 64
          ca = (tmp / "hamapp-ci-private-ca.pem").read_text("ascii")
          pin = hashlib.sha256(ssl.PEM_cert_to_DER_cert(ca)).hexdigest()
          context = ssl.create_default_context(cafile=str(tmp / "hamapp-ci-private-ca.pem"))
          context.minimum_version = ssl.TLSVersion.TLSv1_2
          def send(method, data=b"", token=None, candidate=None):
              connection = http.client.HTTPSConnection(
                  "localhost", 8766, context=context, timeout=10)
              try:
                  connection.connect()
                  observed = hashlib.sha256(
                      connection.sock.getpeercert(binary_form=True)).hexdigest()
                  assert observed == pin
                  headers = {"Content-Type": "application/octet-stream"}
                  if token is not None:
                      headers["Authorization"] = "Bearer " + token
                      headers["X-HamApp-Publisher"] = "ci-publisher"
                      headers["X-HamApp-Candidate-Base64"] = base64.b64encode(
                          json.dumps(candidate).encode("utf-8")).decode("ascii")
                  connection.request(method, "/v1/submissions", body=data, headers=headers)
                  response = connection.getresponse()
                  return response.status, json.loads(response.read(8192))
              finally:
                  connection.close()
          for attempt in range(15):
              try:
                  status, output = send("GET")
                  if status == 405:
                      break
              except (OSError, ssl.SSLError, AssertionError):
                  time.sleep(1)
          else:
              raise AssertionError("real Docker TLS listener did not become reachable")
          assert output == {"error": "read_api_disabled"}
          artifact = b"NONEXECUTABLE-GITHUB-HOSTED-CONTAINER-TEST"
          candidate = {
              "release": {
                  "app_id": "ci-demo", "platform": "windows", "version": "1.2.3",
                  "asset_url": ("https://github.com/rezamahrm100-ops/ci-publisher/"
                                "releases/download/v1.2.3/candidate.exe"),
                  "sha256": hashlib.sha256(artifact).hexdigest(),
                  "size_bytes": len(artifact)
              },
              "source_repo": "ci-publisher", "source_sha": "a" * 40,
              "package_id": None, "version_code": None
          }
          rejected, _ = send("POST", artifact, "x" * 64, candidate)
          assert rejected == 401
          admitted, reply = send("POST", artifact, secret, candidate)
          assert admitted == 202 and reply["status"] == "quarantined"
          assert reply["owner_review_approved"] is False
          assert reply["public_distribution_authorized"] is False
          print("HAMAPP_REAL_DOCKER_TLS_TOKEN_BINARY_QUARANTINE_PASS")
          PY
          rm -f "$RUNNER_TEMP/hamapp-ci-private-first-token.txt" \
            "$RUNNER_TEMP/hamapp-ci-private-ca.pem"
          mkdir -p dist/owner-preview/service
          python3 scripts/build_service_kit.py \
            --output dist/owner-preview/service/HamApp-Private-Service-Kit.zip \
            --source-sha "$GITHUB_SHA"
          test -s dist/owner-preview/service/HamApp-Private-Service-Kit.zip
          sha256sum dist/owner-preview/service/HamApp-Private-Service-Kit.zip > dist/owner-preview/service/SHA256SUMS.txt
      - name: Upload backend self-configure kit (no signing keys or accounts)
        uses: actions/upload-artifact@v4
        with:
          name: HamApp-Private-Service-Ready-To-Configure
          path: dist/owner-preview/service/
          retention-days: 7
          if-no-files-found: error
      - name: Boundaries of the private service build
        if: success()
        shell: bash
        run: |
          echo "### HamApp Private Service" >> "$GITHUB_STEP_SUMMARY"
          echo "Source: $GITHUB_SHA; assembled Docker service and local configuration kit; no production deployment, real signer, owner identity, or public release." >> "$GITHUB_STEP_SUMMARY"

  windows:
    if: github.repository == 'rezamahrm100-ops/hamapp-store' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: windows-2022
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Compile portable native Windows GUI
        shell: pwsh
        run: |
          python -m unittest discover -s tests -v
          if ($LASTEXITCODE -ne 0) { throw 'Tests failed' }
          python scripts/build_windows_client_catalog.py
          if ($LASTEXITCODE -ne 0) { throw 'Manifest generation failed' }
          if (-not (Test-Path 'dist/windows-client/store-capabilities.json' -PathType Leaf)) { throw 'UI contract missing' }
          python -m pip install --disable-pip-version-check pyinstaller==6.22.3 ttkbootstrap==2.2.6
          if ($LASTEXITCODE -ne 0) { throw 'Pinned PyInstaller failed' }
          python -m PyInstaller --noconfirm --clean --onefile --windowed --name HamApp-Windows-Preview --add-data "dist/windows-client/windows-client-catalog.json:." --add-data "dist/windows-client/store-capabilities.json:." run_windows_client.py
          if ($LASTEXITCODE -ne 0 -or -not (Test-Path 'dist/HamApp-Windows-Preview.exe' -PathType Leaf)) { throw 'Portable EXE build failed' }
          New-Item -ItemType Directory -Force 'dist/owner-preview/windows' | Out-Null
          Copy-Item 'dist/HamApp-Windows-Preview.exe' 'dist/owner-preview/windows/HamApp-Windows-Preview.exe'
      - name: Compile per-user NSIS installer without executing on owner device
        shell: pwsh
        run: |
          choco install nsis --version=3.11.0 -y --no-progress --limit-output
          if ($LASTEXITCODE -ne 0) { throw 'Pinned NSIS unavailable' }
          $pf86 = [Environment]::GetFolderPath('ProgramFilesX86')
          $candidates = @((Join-Path $pf86 'NSIS\makensis.exe'), (Join-Path $env:ProgramFiles 'NSIS\makensis.exe'))
          $compiler = $candidates | Where-Object { Test-Path -LiteralPath $_ -PathType Leaf } | Select-Object -First 1
          if (-not $compiler) { throw 'NSIS not found' }
          $inputExe = (Resolve-Path 'dist/HamApp-Windows-Preview.exe').Path
          $outputExe = (Join-Path (Resolve-Path 'dist/owner-preview/windows').Path 'HamApp-Preview-Setup-UNSIGNED.exe')
          & $compiler '/V3' '/DPACKAGE_CODE=1' "/DINPUT_EXE=$inputExe" "/DOUTPUT_EXE=$outputExe" 'windows_installer/HamAppPreview.nsi'
          if ($LASTEXITCODE -ne 0 -or -not (Test-Path -LiteralPath $outputExe -PathType Leaf)) { throw 'NSIS setup compilation failed' }
          Copy-Item 'scripts/HamApp-Verify-Preview.cmd' 'dist/owner-preview/windows/HamApp-Verify-Preview.cmd'
          python scripts/package_owner_preview.py --platform windows --directory 'dist/owner-preview/windows'
          if ($LASTEXITCODE -ne 0) { throw 'Manifest failed' }
      - name: Real one-click integrity verifier positive and tamper negative checks
        shell: pwsh
        run: |
          & cmd.exe /d /c "dist\\owner-preview\\windows\\HamApp-Verify-Preview.cmd --ci"
          if ($LASTEXITCODE -ne 0) { throw 'Owner one-click hash verifier rejected genuine Windows preview' }
          $tamper = Join-Path $env:RUNNER_TEMP 'hamapp-owner-preview-corrupt'
          Copy-Item -LiteralPath 'dist/owner-preview/windows' -Destination $tamper -Recurse
          Add-Content -LiteralPath (Join-Path $tamper 'HamApp-Windows-Preview.exe') -Value 'corrupt' -NoNewline
          Push-Location $tamper
          try {
            & cmd.exe /d /c "HamApp-Verify-Preview.cmd --ci"
            if ($LASTEXITCODE -eq 0) { throw 'Owner integrity verifier accepted altered EXE' }
            Write-Host 'HAMAPP_PREVIEW_SHA256_TAMPER_REJECTION_PASS'
          } finally {
            Pop-Location
          }
          # The corrupt-file rejection is expected; do not let cmd.exe's
          # negative-test exit code poison the succeeding PowerShell step.
          $global:LASTEXITCODE = 0
      - name: Upload portable EXE, per-user Setup, SHA256 and Persian notes
        uses: actions/upload-artifact@v4
        with:
          name: HamApp-Windows-Owner-Test-EXE-Setup
          path: dist/owner-preview/windows/
          retention-days: 7
          if-no-files-found: error
      - name: Report owner-only test scope
        if: success()
        shell: pwsh
        run: |
          '### HamApp Windows portable EXE + unsigned per-user NSIS installer (owner test)' | Out-File $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          "Source SHA: $env:GITHUB_SHA. This is NOT production Authenticode signed, publicly approved or owner-device verified." | Out-File $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
