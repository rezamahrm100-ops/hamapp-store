name: Publish HamApp storefront
on:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - 'catalog/**'
      - 'scripts/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: hamapp-pages
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Validate and build
        run: |
          python3 -m unittest discover -s tests -v
          python3 scripts/build_site.py
      - name: Setup Pages
        uses: actions/configure-pages@v6
      - name: Upload site
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./dist/site
      - name: Publish
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify ACTUAL deployed HTTPS page and release metadata bytes
        shell: bash
        run: |
          python3 scripts/verify_live_pages.py \
            --site-dir dist/site \
            --receipt dist/live-pages-qa-receipt.json \
            --attempts 12 \
            --retry-seconds 5
      - name: Upload public-only deployment parity receipt
        uses: actions/upload-artifact@v4
        with:
          name: hamapp-real-https-pages-byte-parity
          path: dist/live-pages-qa-receipt.json
          if-no-files-found: error
          retention-days: 5
      - name: Disclose exact parity scope
        shell: bash
        run: |
          echo '### LIVE PUBLIC HTTPS BYTE PARITY VERIFIED' >> "$GITHUB_STEP_SUMMARY"
          echo 'Exact published HTML, CSS, JavaScript, service worker and catalogue bytes matched the built site without redirects using CA-validated HTTPS.' >> "$GITHUB_STEP_SUMMARY"
          echo 'This is NOT publisher web-app origin, immutable third-party release, signing, uptime or malware acceptance.' >> "$GITHUB_STEP_SUMMARY"
