name: HamApp Isolated F-Droid Signed Index Drill
on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/fdroid_signed_repo_drill.py'
      - 'scripts/android_two_version_smoke.sh'
      - 'scripts/verify_fdroid_private_stage.py'
      - 'scripts/fdroid_bridge.py'
      - 'tests/test_verify_fdroid_private_stage.py'
      - '.github/workflows/fdroid-signed-index-drill.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/fdroid_signed_repo_drill.py'
      - 'scripts/verify_fdroid_private_stage.py'
      - 'scripts/fdroid_bridge.py'
      - 'tests/test_verify_fdroid_private_stage.py'
      - 'tests/test_fdroid_signed_repo_drill.py'
      - '.github/workflows/fdroid-signed-index-drill.yml'
      - 'android/**'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: hamapp-fdroid-drill-${{ github.ref }}
  cancel-in-progress: true
jobs:
  signed-repository-drill:
    if: github.repository == 'rezamahrm100-ops/hamapp-store' && (github.ref == 'refs/heads/main' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository))
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Install pinned current official fdroidserver and Androguard in isolated venv
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/hamapp-fdroid-venv"
          "$RUNNER_TEMP/hamapp-fdroid-venv/bin/python" -m pip install --disable-pip-version-check "fdroidserver==2.4.5" "androguard==4.1.4"
          echo "$RUNNER_TEMP/hamapp-fdroid-venv/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/hamapp-fdroid-venv/bin/fdroid" --version
      - name: Ensure Android SDK platform and build-tools
        shell: bash
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install 'platforms;android-35' 'build-tools;35.0.0'
          echo "$ANDROID_HOME/build-tools/35.0.0" >> "$GITHUB_PATH"
      - name: Build actual HamApp native debug APK
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tests -v
          bash scripts/android_two_version_smoke.sh prepare
          test -s dist/android-two-version/v1.apk
          test -s dist/android-two-version/v2.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify dist/android-two-version/v1.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify dist/android-two-version/v2.apk
      - name: Create disposable signed index v2, validate local signed JAR and exact APK; reject wrong keys/tampering
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/fdroid-sandbox-evidence
          python3 scripts/fdroid_signed_repo_drill.py \
            --apk dist/android-two-version/v1.apk \
            --apk-v2 dist/android-two-version/v2.apk \
            --source-sha "$GITHUB_SHA" \
            --receipt dist/fdroid-sandbox-evidence/signed-index-drill.json
      - name: Remove ephemeral debug APKs and synthetic test signer before artifact upload
        if: always()
        shell: bash
        run: rm -rf dist/android-two-version
      - name: Upload safe receipt ONLY, never repo keystore or config
        uses: actions/upload-artifact@v4
        with:
          name: hamapp-ephemeral-fdroid-signed-index-evidence
          path: dist/fdroid-sandbox-evidence/signed-index-drill.json
          if-no-files-found: error
          retention-days: 7
      - name: Disclose strict acceptance boundary
        shell: bash
        run: |
          echo '### Real signed F-Droid index-v2 verification with a disposable CI key' >> "$GITHUB_STEP_SUMMARY"
          echo 'Two real debug APK versions and same disposable repo key verified across separately signed indexes, immutable APK identities, wrong key and tampered metadata rejection. No production key/deployment/owner live APK/official client install. All ephemeral keys deleted before artifact upload.' >> "$GITHUB_STEP_SUMMARY"
