name: HamApp Windows Desktop Preview EXE
on:
  pull_request:
    branches: [main]
    paths:
      - 'windows_client/**'
      - 'run_windows_client.py'
      - 'scripts/build_windows_client_catalog.py'
      - 'scripts/build_ui_contract.py'
      - 'tests/test_build_ui_contract.py'
      - 'catalog/**'
      - 'tests/test_windows_client.py'
      - 'tests/test_windows_authenticode_real_drill.py'
      - 'scripts/windows_authenticode_real_drill.py'
      - 'scripts/windows_authenticode_real_drill.ps1'
      - 'scripts/windows_ephemeral_pfx.py'
      - 'scripts/portable_authenticode_drill.py'
      - 'windows_installer/**'
      - 'scripts/windows_nsis_sandbox_acceptance.ps1'
      - 'scripts/windows_v2_native_ci_entry.py'
      - 'scripts/windows_build_distinct_v2_ci.ps1'
      - 'tests/test_windows_nsis_sandbox.py'
      - 'scripts/publisher_gate.py'
      - '.github/workflows/windows-client-preview.yml'
  push:
    branches: [main]
    paths:
      - 'windows_client/**'
      - 'run_windows_client.py'
      - 'scripts/build_windows_client_catalog.py'
      - 'scripts/build_ui_contract.py'
      - 'tests/test_build_ui_contract.py'
      - 'catalog/**'
      - 'tests/test_windows_client.py'
      - 'tests/test_windows_authenticode_real_drill.py'
      - 'scripts/windows_authenticode_real_drill.py'
      - 'scripts/windows_authenticode_real_drill.ps1'
      - 'scripts/windows_ephemeral_pfx.py'
      - 'scripts/portable_authenticode_drill.py'
      - 'windows_installer/**'
      - 'scripts/windows_nsis_sandbox_acceptance.ps1'
      - 'scripts/windows_v2_native_ci_entry.py'
      - 'scripts/windows_build_distinct_v2_ci.ps1'
      - 'tests/test_windows_nsis_sandbox.py'
      - 'scripts/publisher_gate.py'
      - '.github/workflows/windows-client-preview.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: hamapp-windows-preview-${{ github.ref }}
  cancel-in-progress: true
jobs:
  desktop-preview:
    permissions:
      contents: read
    runs-on: windows-2022
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run full offline test suite
        shell: pwsh
        run: |
          python -m unittest discover -s tests -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Generate validated embedded Windows catalogue
        shell: pwsh
        run: |
          python scripts/build_windows_client_catalog.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not (Test-Path 'dist/windows-client/store-capabilities.json' -PathType Leaf)) { throw 'UI backend contract missing' }
      - name: Install pinned open-source PyInstaller on ephemeral hosted runner
        run: python -m pip install --disable-pip-version-check pyinstaller==6.22.3 ttkbootstrap==2.2.6
      - name: Build one-file Windows GUI (unsigned preview)
        shell: pwsh
        run: |
          python -m PyInstaller --noconfirm --clean --onefile --windowed --name HamApp-Windows-Preview --add-data "dist/windows-client/windows-client-catalog.json:." --add-data "dist/windows-client/store-capabilities.json:." run_windows_client.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not (Test-Path dist/HamApp-Windows-Preview.exe)) { throw "Preview EXE not produced" }
          Get-FileHash dist/HamApp-Windows-Preview.exe -Algorithm SHA256 | Format-List
      - name: Upload short-lived unsigned preview for owner QA only
        uses: actions/upload-artifact@v7
        with:
          name: hamapp-windows-unsigned-preview
          path: dist/HamApp-Windows-Preview.exe
          if-no-files-found: error
          retention-days: 3
      - name: Disclose preview restrictions
        shell: pwsh
        run: |
          "### UNSIGNED WINDOWS CLIENT PREVIEW ONLY" | Out-File $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          "The Windows preview is UNSIGNED. The separately gated hosted Linux job signs independent temporary PE copies with disposable OpenSSL keys and verifies real Authenticode cryptography, not native Windows OS trust or a production publisher identity. No owner-device installation." | Out-File $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8

  portable-authenticode:
    name: Real offline PE Authenticode with two disposable publishers
    needs: desktop-preview
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: hamapp-windows-unsigned-preview
          path: dist/native-input
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install real upstream PE Authenticode validator
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends osslsigncode
          osslsigncode -v
          python -m pip install --disable-pip-version-check --only-binary=:all: cryptography==50.0.2
      - name: Real portable signing, exact signer pin and negative signature verification
        shell: bash
        timeout-minutes: 6
        run: |
          set -euo pipefail
          test -s dist/native-input/HamApp-Windows-Preview.exe
          python scripts/portable_authenticode_drill.py \
            --unsigned dist/native-input/HamApp-Windows-Preview.exe \
            --source-sha "$GITHUB_SHA" \
            --receipt dist/windows-authenticode-evidence/receipt.json
          test -s dist/windows-authenticode-evidence/receipt.json
      - name: Upload only non-production cryptographic receipt; no test PFX or signed PE
        uses: actions/upload-artifact@v7
        with:
          name: hamapp-real-disposable-portable-authenticode-evidence
          path: dist/windows-authenticode-evidence/receipt.json
          if-no-files-found: error
          retention-days: 7
      - name: Accurate native OS trust boundary
        shell: bash
        run: |
          echo '### Real PE Authenticode cryptography accepted on isolated Linux' >> "$GITHUB_STEP_SUMMARY"
          echo 'Two disposable signed real Windows EXE copies, wrong signer, unsigned and tampered checks run. Windows OS WinVerifyTrust, real production signer, installer and physical device NOT accepted.' >> "$GITHUB_STEP_SUMMARY"

  native-windows-authenticode:
    name: Native Windows disposable CA-chain verification and untrusted Authenticode status
    if: github.repository == 'rezamahrm100-ops/hamapp-store' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    needs: desktop-preview
    runs-on: windows-2022
    timeout-minutes: 18
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: hamapp-windows-unsigned-preview
          path: dist
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned public cryptography implementation for disposable signer only
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check --only-binary=:all: cryptography==50.0.2
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Native X509Chain in-memory correct CA/wrong root and Authenticode fail-closed PE checks
        shell: pwsh
        timeout-minutes: 8
        run: |
          if (-not (Test-Path 'dist/HamApp-Windows-Preview.exe' -PathType Leaf)) { throw 'Unsigned native Windows PE was not built' }
          ./scripts/windows_authenticode_real_drill.ps1 -UnsignedExe 'dist/HamApp-Windows-Preview.exe'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not (Test-Path 'dist/windows-authenticode-evidence/receipt.json' -PathType Leaf)) { throw 'Actual native trust proof missing' }
      - name: Upload ONLY non-production OS verification receipt, never PFX or signed executables
        uses: actions/upload-artifact@v7
        with:
          name: hamapp-native-windows-ephemeral-trust-evidence
          path: dist/windows-authenticode-evidence/receipt.json
          if-no-files-found: error
          retention-days: 5
      - name: Native signer scope disclosure
        shell: pwsh
        run: |
          '### Native in-memory disposable code-signing CA chain and OS non-Valid signer observation' | Out-File $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          'Real hosted Windows x64 SDK signed PE with two distinct disposable test roots and code-signing leaves. Native in-memory X509Chain must accept each exact local test root and reject cross-root. Windows Authenticode still reports UnknownError (NOT Valid) for both OS-untrusted test signatures, and rejects unsigned/tampered PE. CustomTrustStore exists only in process memory; no OS trust-store changes, production approved publisher certificate, WinGet release, physical owner QA or public release permission was verified.' | Out-File $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8

  nsis-installer-sandbox:
    name: Actual isolated per-user Windows installer/upgrade/downgrade/uninstall
    if: github.repository == 'rezamahrm100-ops/hamapp-store' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    needs: desktop-preview
    runs-on: windows-2022
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: hamapp-windows-unsigned-preview
          path: dist
      - name: Verify real native Windows PyInstaller input is present
        shell: pwsh
        run: |
          if (-not (Test-Path 'dist/HamApp-Windows-Preview.exe' -PathType Leaf)) { throw 'Missing genuine hosted Windows EXE' }
          Get-FileHash 'dist/HamApp-Windows-Preview.exe' -Algorithm SHA256 | Format-List
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build two actually distinct native Windows GUI executable sources
        shell: pwsh
        timeout-minutes: 12
        run: |
          ./scripts/windows_build_distinct_v2_ci.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Install pinned free upstream NSIS 3.11 compiler on hosted Windows only
        shell: pwsh
        run: |
          choco install nsis --version=3.11.0 -y --no-progress --limit-output
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Real per-user NSIS install, installer-v2 upgrade, deny downgrade, exact EXE hash and uninstall
        shell: pwsh
        timeout-minutes: 8
        run: |
          ./scripts/windows_nsis_sandbox_acceptance.ps1 -UnsignedExe 'dist/HamApp-Windows-Preview.exe' -SecondUnsignedExe (Join-Path $env:RUNNER_TEMP 'hamapp-distinct-exe-v2/dist/HamApp-Windows-V2-CI-ONLY.exe')
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not (Test-Path 'dist/windows-installer-evidence/receipt.json' -PathType Leaf)) { throw 'Missing actual native install receipt' }
      - name: Upload bounded SAFE install verification receipt, never unapproved installer EXEs
        uses: actions/upload-artifact@v7
        with:
          name: hamapp-real-hosted-nsis-install-qa
          path: dist/windows-installer-evidence/receipt.json
          if-no-files-found: error
          retention-days: 7
      - name: Disclose Windows installer release gate
        if: success()
        shell: pwsh
        run: |
          "### Real hosted Windows unsigned NSIS per-user installer QA PASS" | Out-File $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          "Actual per-user v1 install, version-2 installer upgrade, older installer downgrade refused, exact installed PyInstaller EXE digest and real uninstall/registry cleanup. Both installers are UNSIGNED test-only; the actual GUI app v2 is source-modified and has different binary bytes. No production Authenticode/WinGet, owner-device consent or public release." | Out-File $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8

  attest-and-verify:
    name: Verify trusted-main unsigned Windows EXE provenance
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository == 'rezamahrm100-ops/hamapp-store'
    needs: desktop-preview
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: hamapp-windows-unsigned-preview
          path: dist/native-artifact
      - name: Validate subject exists
        shell: bash
        run: |
          test -s dist/native-artifact/HamApp-Windows-Preview.exe
          sha256sum dist/native-artifact/HamApp-Windows-Preview.exe
      - name: Issue GitHub build attestation, not developer code signature
        uses: actions/attest@v4
        with:
          subject-path: dist/native-artifact/HamApp-Windows-Preview.exe
      - name: Independently verify expected workflow, branch and commit
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5 6; do
            if gh attestation verify dist/native-artifact/HamApp-Windows-Preview.exe --repo rezamahrm100-ops/hamapp-store --signer-workflow rezamahrm100-ops/hamapp-store/.github/workflows/windows-client-preview.yml --source-ref refs/heads/main --source-digest "$GITHUB_SHA" --deny-self-hosted-runners --format json > verified.json; then
              break
            fi
            if [ "$attempt" -eq 6 ]; then echo "Native binary provenance verification failed" >&2; exit 1; fi
            sleep 5
          done
          mkdir -p dist/native-evidence
          python3 scripts/attested_binary_receipt.py --artifact dist/native-artifact/HamApp-Windows-Preview.exe --verified-gh-json verified.json --role windows-unsigned --source-sha "$GITHUB_SHA" --output dist/native-evidence/receipt.json
          echo 'Verified a signed GitHub build attestation for this main SHA and native binary.'
          echo 'This does NOT verify Android/Authenticode production signing, F-Droid index or real installation.' >> "$GITHUB_STEP_SUMMARY"

      - name: Save short-lived verified provenance receipt
        uses: actions/upload-artifact@v7
        with:
          name: hamapp-windows-unsigned-provenance
          path: dist/native-evidence/receipt.json
          if-no-files-found: error
          retention-days: 7
