plugins {
    id 'com.android.application'
}
android {
    namespace 'ir.hamapp.store'
    compileSdk 36
    defaultConfig {
        applicationId 'ir.hamapp.store'
        minSdk 28
        targetSdk 35
        versionCode 1
        versionName '0.1.0-preview'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }
    buildTypes {
        release { minifyEnabled false }
        debug { debuggable true }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    buildFeatures { buildConfig false }
}

// Material 3 Views: native Java screens; no Kotlin/Compose migration.
dependencies {
    implementation 'com.google.android.material:material:1.14.0'
    // Apache-2.0 official F-Droid index and signed repository entry verifier.
    implementation 'org.fdroid:index:0.2.0'
    implementation 'org.fdroid:core:0.0.1'
    // Official AndroidX durable network-constrained worker; no parallel updater.
    implementation 'androidx.work:work-runtime:2.12.0'
    androidTestImplementation 'androidx.test:core:1.7.0'
    androidTestImplementation 'androidx.test.ext:junit:1.3.0'
    androidTestImplementation 'androidx.test:runner:1.7.0'
}
