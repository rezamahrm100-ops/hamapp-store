plugins {
    id 'com.android.application'
}
android {
    namespace 'ir.hamapp.store'
    compileSdk 36
    defaultConfig {
        applicationId 'ir.hamapp.store'
        minSdk 28
        targetSdk 35
        versionCode 1
        versionName '0.1.0-preview'
    }
    buildTypes {
        release { minifyEnabled false }
        debug { debuggable true }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    buildFeatures { buildConfig false }
}

// Material 3 Views: native Java screens; no Kotlin/Compose migration.
dependencies {
    implementation 'com.google.android.material:material:1.14.0'
    // Apache-2.0 official F-Droid index and signed repository entry verifier.
    implementation 'org.fdroid:index:0.2.0'
    implementation 'org.fdroid:core:0.0.1'
}
